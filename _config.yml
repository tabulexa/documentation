title: Tabulexa Board
title_separator: "|"
name: MuXappDev
description: "Digital whiteboard and PowerPoint teaching documentation."
url: "https://tabulexa.github.io"
baseurl: "/documentation"
repository: "tabulexa/documentation"
locale: en-GB
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "air"
search: true
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: false
      classes: wide
footer:
  links: []
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE_THEME.md
  - vendor
  - .github
atom_feed:
  hide: true
logo: "/assets/images/tabulexa-logo.png"
show_title: false